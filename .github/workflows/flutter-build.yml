name: Build Custom RustDesk Windows

on:
  workflow_dispatch:

env:
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  SCITER_RUST_VERSION: "1.75"

jobs:
  generate-bridge:
    name: Generate Flutter Bridge
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    name: Build TopMostWindow
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows:
    name: Build Windows Flutter x64
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        shell: powershell
        run: |
          flutter doctor -v
          flutter precache --windows

          # Obtener dinámicamente la ruta de Flutter
          $flutterBin = Split-Path -Parent (Get-Command flutter).Source
          $engineDest = Join-Path $flutterBin "cache\artifacts\engine\windows-x64-release"

          if (-not (Test-Path $engineDest)) {
            New-Item -ItemType Directory -Path $engineDest -Force | Out-Null
          }

          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release -Force
          Copy-Item -Path "windows-x64-release\*" -Destination $engineDest -Recurse -Force

      - name: Patch Flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Configure and Install vcpkg dependencies
        shell: bash
        run: |
          echo "VCPKG_ROOT=C:/vcpkg" >> $GITHUB_ENV
          C:/vcpkg/vcpkg integrate install
          C:/vcpkg/vcpkg install --triplet x64-windows-static \
            --x-install-root="C:/vcpkg/installed" \
            libvpx libyuv opus aom ffmpeg

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@v4
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Build RustDesk
        shell: powershell
        env:
          VCPKG_ROOT: "C:/vcpkg"
          INCLUDE: "C:/vcpkg/installed/x64-windows-static/include;$env:INCLUDE"
          LIB: "C:/vcpkg/installed/x64-windows-static/lib;$env:LIB"
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Dependencias de monitor virtual
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: Empacar ejecutable portable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./ArtifactOutput
          mv ./target/release/rustdesk-portable-packer.exe ./ArtifactOutput/rustdesk-custom-x64.exe

      - name: Subir artefacto compilado
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Custom-Windows-x64
          path: ./ArtifactOutput/rustdesk-custom-x64.exe
